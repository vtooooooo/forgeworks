name: ForgeWorks CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check src tests migrations examples
      - run: mypy src
      - run: pytest -q
      - run: alembic upgrade head && alembic check
      - run: docker build -t forgeworks:ci .
      - run: |
          docker run -d --name forgeworks-ci -p 127.0.0.1:8000:8000 forgeworks:ci
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/health
      - name: Verify PostgreSQL Compose migrations and API workflow
        env:
          FORGEWORKS_PLANNER_TOKEN: ci-local-planner
        run: |
          docker compose up -d --build --wait api-postgres
          docker compose exec -T api-postgres alembic current
          docker compose exec -T api-postgres alembic check
          python examples/compose_smoke.py
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop PostgreSQL Compose stack
        if: always()
        run: docker compose down --volumes
  command-center:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: npm ci && npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Verify the packaged command center
        run: |
          docker compose -p forgeworks-ci-console --profile console up -d --build --wait command-center
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:4173/health
          curl --fail http://127.0.0.1:4173/api/v1/console/catalog
          npm --prefix frontend run e2e
        env:
          FORGEWORKS_CONSOLE_PLANNER_TOKEN: ci-console-local
          FORGEWORKS_E2E_URL: http://127.0.0.1:4173
      - if: failure()
        run: docker compose -p forgeworks-ci-console --profile console logs --no-color
      - if: always()
        run: docker compose -p forgeworks-ci-console --profile console down --volumes
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: command-center-browser-traces
          path: frontend/test-results
