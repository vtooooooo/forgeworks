services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FORGEWORKS_PLANNER_TOKEN: ${FORGEWORKS_PLANNER_TOKEN:-}
    volumes:
      - app_data:/data
  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: forgeworks
      POSTGRES_USER: forgeworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U forgeworks -d forgeworks"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data
  api-postgres:
    extends: api
    profiles: [postgres]
    ports: !override
      - "127.0.0.1:8001:8000"
    environment:
      FORGEWORKS_DATABASE_URL: postgresql+psycopg://forgeworks:${POSTGRES_PASSWORD:-local-demo}@postgres:5432/forgeworks
    depends_on:
      postgres:
        condition: service_healthy
  console-api:
    build: .
    profiles: [console]
    environment:
      FORGEWORKS_DEMO_SEED: "1"
      FORGEWORKS_CONSOLE_MODE: ${FORGEWORKS_CONSOLE_MODE:-local}
      FORGEWORKS_PLANNER_TOKEN: ${FORGEWORKS_CONSOLE_PLANNER_TOKEN:-}
    command: ["sh", "-c", "alembic upgrade head && python examples/console_seed.py && exec uvicorn forgeworks.api:app --host 0.0.0.0 --port 8000"]
    volumes:
      - console_data:/data
  command-center:
    build: ./frontend
    profiles: [console]
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      console-api:
        condition: service_healthy
volumes:
  console_data:
  app_data:
  pg_data:
