[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeworks"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["ortools>=9.12,<10", "scikit-learn>=1.6,<2", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "simpy>=4,<5", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
[tool.ruff]
line-length = 100
